name: baseline

services:
  postgres:
    image: postgres:18.1
    restart: unless-stopped
    networks: [backend]
    volumes:
      - postgres_data_baseline:/var/lib/postgresql/data
      - ./artifacts/postgres-init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baseline}
      POSTGRES_USER: ${POSTGRES_USER:-baseline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: UTC
    command:
      - "postgres"
      - "--shared_buffers=256MB"
      - "--work_mem=16MB"
      - "--maintenance_work_mem=128MB"
      - "--effective_cache_size=1GB"
      - "--max_connections=100"
      - "--max_replication_slots=5"
      - "--checkpoint_timeout=10min"
      - "--max_wal_size=4GB"
      - "--max_wal_senders=5"
      - "--wal_compression=lz4"
      - "--synchronous_commit=on"
      - "--fsync=on"
      - "--full_page_writes=on"
      - "--log_line_prefix=%m [%p] %u@%d "
      - "--log_min_duration_statement=500ms"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=${POSTGRES_USER:-baseline} --dbname=${POSTGRES_DB:-baseline}"]
      interval: 10s
      timeout: 45s
      retries: 10

  baseline:
    image: baseline:latest
    build:
      context: .
      args:
        CONTAINER_UID: ${CONTAINER_UID:-1000}
        CONTAINER_GID: ${CONTAINER_GID:-1000}
    environment:
      IS_DEV: ${IS_DEV:-false}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      POSTGRES_DB: ${POSTGRES_DB:-baseline}
      POSTGRES_USER: ${POSTGRES_USER:-baseline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-60}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-0.0.0.0,127.0.0.1,localhost}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      HOME: /home/devuser
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    networks: [backend, egress]
    command:
      - "gunicorn"
      - "core.wsgi:application"
      - "--bind"
      - "0.0.0.0:8000"
      - "--workers"
      - "4"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data_baseline:

networks:
  backend:
    internal: true
  egress:
    internal: false
