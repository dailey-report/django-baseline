name: baseline

# dev overrides: runserver, source mount, loopback-only port exposure.
# docker publishes no ports for a container on internal networks only, hence egress.

services:
  postgres:
    networks: [backend, egress]
    ports:
      - "127.0.0.1:5432:5432"

  rabbitmq:
    networks: [backend, egress]
    ports:
      - "127.0.0.1:15672:15672"   # management UI

  baseline:
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./django_root:/opt/app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    tty: true
    stdin_open: true

  # same mounted code as the app, or workers run what was baked into the image.
  # celery does not autoreload: restart workers after changing task code.
  celery-worker:
    volumes:
      - ./django_root:/opt/app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"

  celery-beat:
    volumes:
      - ./django_root:/opt/app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
