[tool.black]
# be sure to match rules in .flake8 with these!
line-length = 94
target-versions = ["py313"]
skip-string-normalization = true
exclude = '''
/(
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 94
multi_line_output = 3
# skip_gitignore == read gitignore and skip listed files
skip_gitignore = true
# include vomit
include_trailing_comma = true
src_paths = ["django_root"]
known_django = "django"
sections = [
    'FUTURE',
    'STDLIB',
    'DJANGO',
    'THIRDPARTY',
    'FIRSTPARTY',
    'LOCALFOLDER'
]
